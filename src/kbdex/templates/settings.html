{% extends "base.html" %}
{% block content %}
<p class="settings-note">Defaults work fine — change these only if you know what you're doing.</p>

<div id="settings-feedback"></div>

<form
  hx-post="/ui/settings"
  hx-target="#settings-feedback"
  hx-swap="innerHTML"
>
  <div class="settings-section">
    <h3>General</h3>
    <label for="search-cache-ttl">Search cache TTL (seconds)</label>
    <input type="number" name="search_cache_ttl_seconds" id="search-cache-ttl" min="60" value="{{ search_cache_ttl }}">
  </div>

  <div class="settings-section">
    <h3>Nyaa.si</h3>
    <label for="nyaa-base-url">Base URL</label>
    <input type="url" name="nyaa_base_url" id="nyaa-base-url" value="{{ nyaa.base_url }}">

    <label for="nyaa-max-pages">Max pages per query</label>
    <input type="number" name="nyaa_max_pages" id="nyaa-max-pages" min="1" max="20" value="{{ nyaa.max_pages }}">
  </div>

  <div class="settings-section">
    <h3>Sukebei</h3>
    <label for="sukebei-base-url">Base URL</label>
    <input type="url" name="sukebei_base_url" id="sukebei-base-url" value="{{ sukebei.base_url }}">

    <label for="sukebei-max-pages">Max pages per query</label>
    <input type="number" name="sukebei_max_pages" id="sukebei-max-pages" min="1" max="20" value="{{ sukebei.max_pages }}">
  </div>

  <button type="submit" class="cta">Save changes</button>
</form>
{% endblock %}
