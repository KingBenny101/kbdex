<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}kbdex{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <nav>
    <a href="/ui/search" class="brand">kbdex</a>
    <a href="/ui/search" {% if active == 'search' %}class="active"{% endif %}>Search</a>
    <a href="/ui/settings" {% if active == 'settings' %}class="active"{% endif %}>Settings</a>
    <a href="/docs" target="_blank" rel="noopener">API docs ↗</a>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"></script>
</body>
</html>
