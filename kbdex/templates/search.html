{% extends "base.html" %}
{% block content %}
<form
  hx-post="/ui/search"
  hx-target="#results"
  hx-swap="innerHTML"
  hx-indicator="#search-spinner"
>
  <label for="id-value">Anime ID</label>
  <div class="id-row">
    <select name="id_type" id="id-type">
      <option value="anidb_id">AniDB</option>
      <option value="mal_id">MyAnimeList</option>
      <option value="anilist_id">AniList</option>
      <option value="kitsu_id">Kitsu</option>
      <option value="tvdb_id">TVDB</option>
      <option value="anisearch_id">AniSearch</option>
      <option value="animenewsnetwork_id">ANN</option>
      <option value="livechart_id">LiveChart</option>
      <option value="simkl_id">Simkl</option>
    </select>
    <input type="number" name="id_value" id="id-value" min="1" placeholder="ID">
  </div>

  <label for="q">Or free-text search</label>
  <input type="text" name="q" id="q" placeholder="e.g. Attack on Titan">

  <div class="filters">
    <div>
      <label for="season">Season</label>
      <input type="number" name="season" id="season" min="1" placeholder="—">
    </div>
    <div>
      <label for="episode">Episode</label>
      <input type="number" name="episode" id="episode" min="1" placeholder="—">
    </div>
    <div>
      <label>Indexers</label>
      <div class="indexer-checks">
        {% for name in indexers %}
        <label><input type="checkbox" name="indexers" value="{{ name }}" checked> {{ name }}</label>
        {% endfor %}
      </div>
    </div>
  </div>

  <button type="submit">
    Search
    <span id="search-spinner" class="htmx-indicator"><span class="spinner"></span></span>
  </button>
</form>

<div id="results"></div>
{% endblock %}
